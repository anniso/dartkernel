name: ui
run-name: ui ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'ref'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.CK_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.ASECRET }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spike-linux/gpui
          cache-on-failure: true
      - run: spike-linux/ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: out/
          retention-days: 1
