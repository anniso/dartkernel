name: check
run-name: check ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'ref'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        task: [check, root]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.CK_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.ASECRET }}
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci.sh ${{ matrix.task }}
