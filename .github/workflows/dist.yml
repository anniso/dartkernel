name: dist
run-name: dist ${{ inputs.ref }} ${{ inputs.os }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'ref'
        required: true
        type: string
      os:
        description: 'os'
        required: true
        type: choice
        default: all
        options: [all, macos, windows, agent]

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  macos:
    if: inputs.os == 'all' || inputs.os == 'macos'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.CK_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.ASECRET }}
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci.sh release
        env:
          RELEASE_ENDPOINT: ${{ secrets.UP_URL }}
          RELEASE_TOKEN: ${{ secrets.UP_TOKEN }}
  windows:
    if: inputs.os == 'all' || inputs.os == 'windows'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.CK_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.ASECRET }}
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop -> desktop/target
      - run: scripts/ci.sh release
        env:
          RELEASE_ENDPOINT: ${{ secrets.UP_URL }}
          RELEASE_TOKEN: ${{ secrets.UP_TOKEN }}
  agent:
    if: inputs.os == 'agent'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.CK_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.ASECRET }}
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci.sh agent
        env:
          RELEASE_ENDPOINT: ${{ secrets.UP_URL }}
          RELEASE_TOKEN: ${{ secrets.UP_TOKEN }}
