name: dist
run-name: dist ${{ inputs.ref }} ${{ inputs.os }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'ref'
        required: true
        type: string
      os:
        description: 'os'
        required: true
        type: choice
        default: all
        options: [all, macos, windows, linux, android, agent, openwrt]

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  macos:
    if: inputs.os == 'all' || inputs.os == 'macos'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.CK_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.ASECRET }}
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci.sh release
        env:
          RELEASE_ENDPOINT: ${{ secrets.UP_URL }}
          RELEASE_TOKEN: ${{ secrets.UP_TOKEN }}
  windows:
    if: inputs.os == 'all' || inputs.os == 'windows'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.CK_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.ASECRET }}
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop -> desktop/target
      - run: scripts/ci.sh release
        env:
          RELEASE_ENDPOINT: ${{ secrets.UP_URL }}
          RELEASE_TOKEN: ${{ secrets.UP_TOKEN }}
  linux:
    if: inputs.os == 'all' || inputs.os == 'linux'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.CK_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.ASECRET }}
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop -> desktop/target
      - run: scripts/ci.sh release
        env:
          RELEASE_ENDPOINT: ${{ secrets.UP_URL }}
          RELEASE_TOKEN: ${{ secrets.UP_TOKEN }}
  agent:
    if: inputs.os == 'agent'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.CK_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.ASECRET }}
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci.sh agent
        env:
          RELEASE_ENDPOINT: ${{ secrets.UP_URL }}
          RELEASE_TOKEN: ${{ secrets.UP_TOKEN }}
  openwrt:
    if: inputs.os == 'openwrt'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.CK_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.ASECRET }}
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci.sh openwrt
        env:
          RELEASE_ENDPOINT: ${{ secrets.UP_URL }}
          RELEASE_TOKEN: ${{ secrets.UP_TOKEN }}
  android:
    if: inputs.os == 'all' || inputs.os == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.CK_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.ASECRET }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci.sh android-release
        env:
          RELEASE_ENDPOINT: ${{ secrets.UP_URL }}
          RELEASE_TOKEN: ${{ secrets.UP_TOKEN }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
