name: Build dart New

# 本文件在 anniso/x 与 anniso/dartkernel 中各有一份，内容保持一致；修改后两边同步。
# 工具链版本集中在下方 env，升级时只改这里（开发构建 build.yml 中有相同的一组，需一起改）。

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which platform to build'
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - linux
          - windows
          - android
          - ios
      task_id:
        description: '唯一id'
        required: true
        type: string

env:
  # 私有仓库地址（owner/repo 格式）
  PRIVATE_REPO: 'anniso/x'
  PRIVATE_REPO_REF: 'master'
  # 工具链
  PNPM_VERSION: '10.28.0'          # 与 pnpm-lock.yaml / pnpm-workspace.yaml（onlyBuiltDependencies）一致
  NODE_VERSION: '22'
  RUST_TOOLCHAIN: '1.97.0'         # 与 checks.yml 一致
  JAVA_VERSION: '21'               # AGP 8.11 要求 JDK 17+
  ANDROID_NDK_VERSION: '29.0.14206865'  # 与 src-tauri/gen/android/app/build.gradle.kts 的 ndkVersion 一致
  ANDROID_BUILD_TOOLS: '35.0.0'    # AGP 8.11 默认 build-tools，apksigner 也用它
  TAURI_CLI_VERSION: '2.12.2'      # 与 package.json 中 @tauri-apps/cli 一致（iOS 的 Xcode 构建阶段调用 cargo tauri）

jobs:
  build-macos:
    name: Build Tauri app (macOS)
    runs-on: macos-latest
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'macos' }}

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.ASECRET }}
          ref: ${{ env.PRIVATE_REPO_REF }}
          path: B_repo

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: B_repo/src-tauri -> target

      - name: Install JS dependencies
        working-directory: B_repo
        run: pnpm install --frozen-lockfile

      - name: Apply custom config
        if: ${{ github.event.inputs.task_id != '' }}
        working-directory: B_repo
        run: npx tsx scripts/customize.ts --task_id=${{ github.event.inputs.task_id }}

      - name: Add Rust targets for universal binary
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build Tauri app (universal)
        working-directory: B_repo
        run: pnpm tauri build --target universal-apple-darwin --bundles app

      - name: Upload to API
        if: ${{ github.event.inputs.task_id != '' }}
        working-directory: B_repo
        run: pnpm tsx scripts/upload-dist.ts --task_id=${{ github.event.inputs.task_id }} --workflow_run_id=${{ github.run_id }} --platform=macos

  build-linux:
    name: Build Tauri app (Linux)
    runs-on: ubuntu-22.04
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'linux' }}

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.ASECRET }}
          ref: ${{ env.PRIVATE_REPO_REF }}
          path: B_repo

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: B_repo/src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            file \
            patchelf

      - name: Install JS dependencies
        working-directory: B_repo
        run: pnpm install --frozen-lockfile

      - name: Apply custom config
        if: ${{ github.event.inputs.task_id != '' }}
        working-directory: B_repo
        run: npx tsx scripts/customize.ts --task_id=${{ github.event.inputs.task_id }}

      - name: Build Tauri app
        working-directory: B_repo
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: pnpm tauri build --bundles appimage,deb

      - name: Upload to API
        if: ${{ github.event.inputs.task_id != '' }}
        working-directory: B_repo
        run: pnpm tsx scripts/upload-dist.ts --task_id=${{ github.event.inputs.task_id }} --workflow_run_id=${{ github.run_id }} --platform=linux

  build-windows:
    name: Build Tauri app (Windows)
    runs-on: windows-latest
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'windows' }}

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.ASECRET }}
          ref: ${{ env.PRIVATE_REPO_REF }}
          path: B_repo

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: B_repo/src-tauri -> target

      - name: Install JS dependencies
        working-directory: B_repo
        run: pnpm install --frozen-lockfile

      - name: Apply custom config
        if: ${{ github.event.inputs.task_id != '' }}
        working-directory: B_repo
        run: npx tsx scripts/customize.ts --task_id=${{ github.event.inputs.task_id }}

      - name: Build Windows TUN Service
        working-directory: B_repo/service
        shell: pwsh
        run: |
          cargo build --release
          # 从 Cargo.toml 获取 service exe 名称（customize.ts 已更新）
          $cargoContent = Get-Content Cargo.toml -Raw
          if ($cargoContent -match 'name\s*=\s*"([^"]+)"') {
            $serviceExeName = $matches[1]
          } else {
            $serviceExeName = "x-tunnel-service"
          }
          # 复制到 sidecar 目录
          New-Item -ItemType Directory -Force -Path ../src-tauri/bin | Out-Null
          Copy-Item target/release/$serviceExeName.exe ../src-tauri/bin/$serviceExeName-x86_64-pc-windows-msvc.exe

      - name: Build Tauri app
        working-directory: B_repo
        run: pnpm tauri build

      - name: Upload to API
        if: ${{ github.event.inputs.task_id != '' }}
        working-directory: B_repo
        run: pnpm tsx scripts/upload-dist.ts --task_id=${{ github.event.inputs.task_id }} --workflow_run_id=${{ github.run_id }} --platform=windows

  build-android:
    name: Build Android (${{ matrix.arch.name }})
    runs-on: ubuntu-22.04
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'android' }}
    env:
      TAURI_ANDROID_ABI_FILTERS: ${{ matrix.arch.name }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: arm64-v8a
            target: aarch64
            rust_target: aarch64-linux-android
            go_arch: arm64-v8a
          - name: x86_64
            target: x86_64
            rust_target: x86_64-linux-android
            go_arch: x86_64

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.ASECRET }}
          ref: ${{ env.PRIVATE_REPO_REF }}
          path: B_repo

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # 默认的 "tools" 包在 cmdline-tools 16+ 中已不存在（sdkmanager 会直接失败），只装 platform-tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      # NDK 版本与 Gradle 的 ndkVersion 保持一致，Go/JNI 与 Rust/Gradle 用同一个 NDK
      - name: Install Android NDK and build-tools
        id: setup-ndk
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}" "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          ndk="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          test -x "$ndk/ndk-build"
          test -x "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          echo "ndk-path=$ndk" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: B_repo/core/go.mod
          cache-dependency-path: B_repo/core/go.sum

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.arch.rust_target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: B_repo/src-tauri -> target
          key: android-${{ matrix.arch.name }}

      - name: Install JS dependencies
        working-directory: B_repo
        run: pnpm install --frozen-lockfile

      - name: Apply custom config
        if: ${{ github.event.inputs.task_id != '' }}
        working-directory: B_repo
        env:
          SKIP_IDENTIFIER_UPDATE: 'true'
        run: npx tsx scripts/customize.ts --task_id=${{ github.event.inputs.task_id }}

      - name: Process Android icons
        if: ${{ github.event.inputs.task_id != '' }}
        working-directory: B_repo
        run: pnpm tsx scripts/process-android-icon.ts --task_id=${{ github.event.inputs.task_id }}

      - name: Setup Android signing
        id: signing
        if: ${{ github.event.inputs.task_id != '' }}
        working-directory: B_repo
        run: pnpm tsx scripts/setup-android-signing.ts --task_id=${{ github.event.inputs.task_id }}

      - name: Build Go core library and JNI bridge
        working-directory: B_repo
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ARCHS: ${{ matrix.arch.go_arch }}
        run: |
          chmod +x scripts/deploy_android.sh
          scripts/deploy_android.sh

      - name: Build Android APK
        working-directory: B_repo
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          TARGET: ${{ matrix.arch.target }}
        run: |
          # tauri-cli 2.10 起 --apk 是开关，之前的版本要写 --apk true；按所检出代码锁定的 CLI 版本选择
          if grep -qE -- '--apk <' <<<"$(pnpm exec tauri android build --help)"; then
            pnpm tauri android build --target "$TARGET" --apk true
          else
            pnpm tauri android build --target "$TARGET" --apk
          fi

      - name: Sign APK
        working-directory: B_repo
        env:
          SIGN_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          SIGN_KEY_ALIAS: ${{ steps.signing.outputs.key_alias }}
          SIGN_PASS_FILE: ${{ steps.signing.outputs.pass_file }}
          HAS_TASK_ID: ${{ github.event.inputs.task_id != '' }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          LEGACY_PROPS="src-tauri/gen/android/keystore.properties"
          LEGACY_JKS="src-tauri/gen/android/app/keystore.jks"

          if [ -n "${SIGN_KEYSTORE:-}" ]; then
            # 当前版本 setup-android-signing.ts：密钥库在仓库外，口令在 0600 文件中
            echo "使用 setup-android-signing.ts 生成的签名"
            KS_ARGS=(--ks "$SIGN_KEYSTORE" --ks-key-alias "$SIGN_KEY_ALIAS"
                     --ks-pass "file:$SIGN_PASS_FILE" --key-pass "file:$SIGN_PASS_FILE")
          elif [ -f "$LEGACY_PROPS" ] && [ -f "$LEGACY_JKS" ]; then
            # 旧版 setup-android-signing.ts（写入 gen/android）；构建旧提交时仍可用
            echo "使用旧版签名文件"
            prop() { grep "^$1=" "$LEGACY_PROPS" | head -1 | cut -d'=' -f2-; }
            KS_PASS="$(prop storePassword)"
            KEY_PASS="$(prop keyPassword)"
            export KS_PASS KEY_PASS
            echo "::add-mask::$KS_PASS"
            echo "::add-mask::$KEY_PASS"
            KS_ARGS=(--ks "$LEGACY_JKS" --ks-key-alias "$(prop keyAlias)"
                     --ks-pass env:KS_PASS --key-pass env:KEY_PASS)
          elif [ "${HAS_TASK_ID:-}" = "true" ]; then
            echo "::error::有 task_id 但没有签名材料，拒绝用临时密钥签名"
            exit 1
          else
            echo "生成临时测试 keystore..."
            KS_PASS="$(openssl rand -hex 16)"
            export KS_PASS
            keytool -genkey -noprompt -keystore "$RUNNER_TEMP/test.jks" \
              -keyalg RSA -keysize 2048 -validity 10000 -alias release \
              -storepass:env KS_PASS -keypass:env KS_PASS \
              -dname "CN=Test, OU=Test, O=Test, L=Test, ST=Test, C=CN"
            KS_ARGS=(--ks "$RUNNER_TEMP/test.jks" --ks-key-alias release
                     --ks-pass env:KS_PASS --key-pass env:KS_PASS)
          fi

          # 查找未签名 APK
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-unsigned.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "未找到未签名 APK"
            exit 1
          fi
          SIGNED_APK="${APK_PATH/-unsigned/}"

          "$APKSIGNER" sign "${KS_ARGS[@]}" --out "$SIGNED_APK" "$APK_PATH"
          "$APKSIGNER" verify "$SIGNED_APK"
          rm "$APK_PATH"
          rm -f "$RUNNER_TEMP/test.jks"

      - name: Upload to API
        if: ${{ github.event.inputs.task_id != '' }}
        working-directory: B_repo
        run: pnpm tsx scripts/upload-dist.ts --task_id=${{ github.event.inputs.task_id }} --workflow_run_id=${{ github.run_id }} --platform=android --arch=${{ matrix.arch.name }}

  build-ios:
    name: Build Tauri app (iOS)
    runs-on: macos-latest
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'ios' }}

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.ASECRET }}
          ref: ${{ env.PRIVATE_REPO_REF }}
          path: B_repo

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: B_repo/core/go.mod
          cache-dependency-path: B_repo/core/go.sum

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: B_repo/src-tauri -> target

      - name: Install cargo-tauri
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked

      - name: Install JS dependencies
        working-directory: B_repo
        run: pnpm install --frozen-lockfile

      - name: Apply custom config
        if: ${{ github.event.inputs.task_id != '' }}
        working-directory: B_repo
        run: npx tsx scripts/customize.ts --task_id=${{ github.event.inputs.task_id }}

      - name: Build Go mobile framework (Mihomo.xcframework)
        working-directory: B_repo/core
        run: |
          chmod +x build-ios.sh
          ./build-ios.sh

      - name: Build iOS app
        working-directory: B_repo
        run: |
          # 编译会成功，但导出阶段因无签名会失败，忽略导出错误
          cargo tauri ios build --ci || true

      - name: Package unsigned IPA
        working-directory: B_repo
        run: |
          # 从 DerivedData 找到已编译的 .app
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -path "*/release-iphoneos/*" -not -path "*PacketTunnel*" -maxdepth 6 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "✗ .app not found in DerivedData"
            exit 1
          fi
          echo "找到 .app: $APP_PATH"

          # 校验 PacketTunnel.appex 是否已嵌入
          if [ ! -d "$APP_PATH/PlugIns/PacketTunnel.appex" ]; then
            echo "⚠ PacketTunnel.appex 未嵌入，从 DerivedData 手动复制..."
            APPEX_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "PacketTunnel.appex" -path "*/release-iphoneos/*" -maxdepth 6 | head -1)
            if [ -z "$APPEX_PATH" ]; then
              echo "✗ PacketTunnel.appex not found in DerivedData"
              exit 1
            fi
            mkdir -p "$APP_PATH/PlugIns"
            cp -r "$APPEX_PATH" "$APP_PATH/PlugIns/"
            echo "✓ 已复制 PacketTunnel.appex 到 PlugIns/"
          else
            echo "✓ PacketTunnel.appex 已嵌入"
          fi

          # 打包为未签名 IPA（Payload/xxx.app → zip）
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          mkdir -p src-tauri/gen/apple/build/arm64
          zip -qr src-tauri/gen/apple/build/arm64/app.ipa Payload
          rm -rf Payload
          echo "✓ IPA 打包完成: src-tauri/gen/apple/build/arm64/app.ipa"

      - name: Upload to API
        if: ${{ github.event.inputs.task_id != '' }}
        working-directory: B_repo
        run: pnpm tsx scripts/upload-dist.ts --task_id=${{ github.event.inputs.task_id }} --workflow_run_id=${{ github.run_id }} --platform=ios